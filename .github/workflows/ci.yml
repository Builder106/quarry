name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

# Cancel in-progress runs when a new commit lands on the same ref — faster
# feedback, lower CI minutes burn.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_NOTIFY_USER_LIST: ""

  contracts:
    name: contracts (forge)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v7

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      # forge-std is installed via `forge install --no-git`, so contracts/lib
      # is gitignored. Re-install in CI so forge test can resolve the import.
      - name: Install forge-std
        run: forge install --no-git foundry-rs/forge-std

      - name: Format check
        run: forge fmt --check test script

      - name: Build (with size report)
        run: forge build --sizes

      # ExecutorFork.t.sol auto-skips when MAINNET_RPC_URL is unset — that's
      # intentional in CI. To run fork tests on a branch, set MAINNET_RPC_URL
      # as a repository secret and add `env: MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}`.
      - name: Test (mocks; fork test skips without RPC)
        run: forge test -vvv

      # `forge snapshot --check` would be nice here but it doesn't gracefully
      # handle the skipped ExecutorForkTest::setUp() entry — complains about
      # no matching snapshot. Defer until we figure out the right --match
      # pattern, or until the fork test is wired with a CI-side RPC secret.

  contracts-fuzz:
    name: contracts fuzz (${{ matrix.fuzz_runs }} runs)
    needs: contracts
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        fuzz_runs: [10000]
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v7

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install forge-std
        run: forge install --no-git foundry-rs/forge-std

      - name: Fuzzing tests
        run: forge test --fuzz-runs ${{ matrix.fuzz_runs }} -vvv

  bot:
    name: bot (bun)
    needs: [bot-lint, bot-format]
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Install deps
        run: bun install

      - name: Dependency audit
        run: |
          for i in 1 2 3; do
            bun audit && exit 0 || true
            echo "bun audit failed or timed out (attempt $i/3), retrying in 5s..."
            sleep 5
          done
          bun audit

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test --coverage --coverage-threshold=100 test/*.test.ts

  bot-lint:
    name: bot lint
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v7
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - run: bun install
      - run: bun run lint

  bot-format:
    name: bot format
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v7
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - run: bun install
      - run: bun run format

  site:
    name: site (bun · vitest · build)
    needs: [site-lint, site-format]
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Install deps
        run: bun install

      # Real Next.js SSRF/DoS CVEs and sharp/libvips CVEs were fixed by
      # bumping next 16.2.10 -> 16.3.0 (non-breaking, same major). Remaining
      # findings are build/test-tooling only, not reachable via untrusted input:
      # postcss (GHSA-r28c-9q8g-f849, Tailwind/Vite build step), undici
      # (GHSA-4cwx-7wf7-3272, jsdom test dependency), and nanoid under postcss
      # (GHSA-28wg-ghj8-5hjv, GHSA-2v37-7h3g-55p8).
      - name: Dependency audit
        run: |
          for i in 1 2 3; do
            bun audit --audit-level=high && exit 0 || true
            echo "bun audit failed or timed out (attempt $i/3), retrying in 5s..."
            sleep 5
          done
          bun audit --audit-level=high

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  site-lint:
    name: site lint
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - run: bun install
      - run: bun run lint

  site-format:
    name: site format
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - run: bun install
      - run: bun run format

  deploy:
    name: Deploy to Vercel
    needs: [secrets, contracts-fuzz, bot, site]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    runs-on: ubuntu-24.04
    steps:
      - name: Trigger Vercel deploy hook
        env:
          VERCEL_DEPLOY_HOOK_STAGING: ${{ secrets.VERCEL_DEPLOY_HOOK_STAGING }}
          VERCEL_DEPLOY_HOOK_PROD: ${{ secrets.VERCEL_DEPLOY_HOOK_PROD }}
        run: |
          if [ "${{ github.ref }}" = "refs/heads/staging" ]; then
            if [ -z "$VERCEL_DEPLOY_HOOK_STAGING" ]; then
              echo "Notice: VERCEL_DEPLOY_HOOK_STAGING is not set; skipping deploy."
              exit 0
            fi
            curl -sS -f -X POST "$VERCEL_DEPLOY_HOOK_STAGING"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            if [ -z "$VERCEL_DEPLOY_HOOK_PROD" ]; then
              echo "Error: VERCEL_DEPLOY_HOOK_PROD is required but not set."
              exit 1
            fi
            curl -sS -f -X POST "$VERCEL_DEPLOY_HOOK_PROD"
          fi
