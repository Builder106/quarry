<title id="diagram-title">Quarry keeps a trade only when it pays</title>
<desc id="diagram-desc">The bot decodes a pending Uniswap V2 swap, reads both pools through Multicall3, sizes the trade with a closed-form solver, and signs a transaction with 220 bytes of packed calldata. The Yul executor swaps on the victim pool, sends the output straight to the counter pool, and swaps back to the base token. If the executor&#x27;s balance grew by at least minProfit it keeps the profit. Otherwise the transaction reverts and both swaps are undone.</desc>
